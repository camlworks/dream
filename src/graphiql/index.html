<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphiQL</title>
    <style>
      body {
        height: 100%;
        margin: 0;
        width: 100%;
        overflow: hidden;
      }
      #graphiql {
        height: 100vh;
      }
      .loading {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 14px/1.5 system-ui, sans-serif;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://esm.sh/graphiql@6.0.0/dist/style.css"
      integrity="sha384-pHzXVzR6TL0s+jcKLsjQ4WlRVmR8RPyAJsLyyym4TLpYnIWUPf20JavS0VxzUz1Y"
      crossorigin="anonymous"
    />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.1",
          "react/": "https://esm.sh/react@19.3.1/",
          "react-dom": "https://esm.sh/react-dom@19.3.1",
          "react-dom/": "https://esm.sh/react-dom@19.3.1/",
          "graphiql": "https://esm.sh/graphiql@6.0.0?standalone&external=react,react-dom,@graphiql/react,graphql",
          "graphiql/": "https://esm.sh/graphiql@6.0.0/",
          "graphiql/setup-workers/esm.sh": "https://esm.sh/graphiql@6.0.0/setup-workers/esm.sh?deps=@graphiql/react@1.0.0",
          "@graphiql/react": "https://esm.sh/@graphiql/react@1.0.0?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid",
          "@graphiql/toolkit": "https://esm.sh/@graphiql/toolkit@1.0.0?standalone&external=graphql",
          "graphql": "https://esm.sh/graphql@17.0.2",
          "graphql-ws": "https://esm.sh/graphql-ws@6.4.1?standalone&external=graphql",
          "@emotion/is-prop-valid": "data:text/javascript,"
        },
        "integrity": {
          "https://esm.sh/react@19.3.1": "sha384-ut1U+oIs0ClaOE7uF1+DZAaHVvYvEJZME3mUuqn95yVqQ70a+8u2LN2LD37JgJkO",
          "https://esm.sh/react-dom@19.3.1": "sha384-FKbbSw/nINZRM0ej/iwjfXbJeAZMJdBKqKmn/I+aIM4Io5qupmM8sZJxaJZDO0sv",
          "https://esm.sh/graphiql@6.0.0": "sha384-4t9K5VrZG+S+yt/m4xfOIM5zsF8FMY4l2Aftx55bVhOvtBuLThHoSK3eammwCVAR",
          "https://esm.sh/graphiql@6.0.0/setup-workers/esm.sh?deps=@graphiql/react@1.0.0": "sha384-dcmwlxdRwyWDBuWAXFrn8lhppqgG+Q9RMm2jeIyigAb+9xSPaloWtU9jfqMlojba",
          "https://esm.sh/graphiql@6.0.0?standalone&external=react,react-dom,@graphiql/react,graphql": "sha384-Cyeb/6CXzM443S0753DNctp2rJbXK7Yh2n9mzeYa+e7qMIqJb0XFRgw4wBFEXNfW",
          "https://esm.sh/@graphiql/react@1.0.0?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid": "sha384-rlyIvc8uhlVsbIJ65FVIrJwYhh4KukDhPCMKZu3r1/EqIUeVD08sYV+vfZXtRDde",
          "https://esm.sh/@graphiql/toolkit@1.0.0?standalone&external=graphql": "sha384-pW1hwiHXozNQ020c1EOLfZkjDANM06ecupsD3iPgx8Az8u2zlYrOL9JhjsjsyMOu",
          "https://esm.sh/graphql@17.0.2": "sha384-IPvlcmnvWT91sKqwbg9MxPXJUuPmSdwXCp22x6hcbBkAEhlfSKkMLR3v19K9iRUp",
          "https://esm.sh/graphql-ws@6.4.1?standalone&external=graphql": "sha384-xYntN4OnDINuDH1StCvXYzc6w7xD8xyTiLyJe0C8jDMyhBRWdBDeCCrWcE0m0Lyw"
        }
      }
    </script>
  </head>
  <body>
    <div id="graphiql"><div class="loading" role="status">Loading GraphiQL…</div></div>
    <script type="module">
      import React from "react";
      import ReactDOM from "react-dom/client";
      import {GraphiQL} from "graphiql";
      import {createTransport} from "@graphiql/toolkit";
      import {createClient} from "graphql-ws";
      import "graphiql/setup-workers/esm.sh";

      const endpoint = "%%ENDPOINT%%";
      const defaultQuery = "%%DEFAULT_QUERY%%";

      const wsSchema = location.protocol === "https:" ? "wss:" : "ws:";
      const wsEndpoint = wsSchema + "//" + window.location.host + endpoint;

      const transport = createTransport({
        url: endpoint,
        // Dream's GraphQL handler does not support GraphQL-over-HTTP GET or
        // OPTIONS.
        supportedMethods: ["POST"],
        subscriptionClient: createClient({url: wsEndpoint}),
      });

      ReactDOM.createRoot(document.getElementById("graphiql")).render(
        React.createElement(GraphiQL, {
          transport,
          defaultQuery,
          defaultEditorToolsVisibility: true,
        })
      );
    </script>
  </body>
</html>
