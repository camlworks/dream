<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <title>GraphiQL 6 with React 19</title>
    <style>
      body {
        margin: 0;
      }

      #graphiql {
        height: 100dvh;
      }

      .loading {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        color-scheme: light dark;
        background: Canvas;
        color: CanvasText;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }

      .loading-status {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .loading-status::before {
        content: '';
        width: 14px;
        height: 14px;
        border: 2px solid #e1009833;
        border-top-color: #e10098;
        border-radius: 50%;
      }

      @media (prefers-reduced-motion: no-preference) {
        .loading-status::before {
          animation: graphiql-loading-spin 0.8s linear infinite;
        }
      }

      @keyframes graphiql-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <script type="module">
      import React from "react";
      import ReactDOM from "react-dom/client";
      import {GraphiQL} from "graphiql";
      import {createTransport} from "@graphiql/toolkit";
      import {createClient} from "graphql-ws";
      import createJSONWorker from "https://esm.sh/monaco-editor@0.57.0/languages/features/json/json.worker.js?worker";
      import createGraphQLWorker from "https://esm.sh/monaco-graphql@2.0.1/esm/graphql.worker.js?worker&deps=monaco-editor@0.57.0";
      import createEditorWorker from "https://esm.sh/monaco-editor@0.57.0/editor/editor.worker.js?worker";

      // Keep the Monaco worker dependencies pinned to exact versions. The
      // worker modules are also loaded from esm.sh.
      globalThis.MonacoEnvironment = {
        getWorker(_workerId, label) {
          switch (label) {
            case "json":
              return new createJSONWorker();
            case "graphql":
              return new createGraphQLWorker();
            default:
              return new createEditorWorker();
          }
        },
      };

      const endpoint = "%%ENDPOINT%%";
      const defaultQuery = "%%DEFAULT_QUERY%%";

      const wsSchema = location.protocol === "https:" ? "wss:" : "ws:";
      const wsEndpoint = wsSchema + "//" + window.location.host + endpoint;

      const transport = createTransport({
        url: endpoint,
        // Dream's GraphQL handler does not support GraphQL-over-HTTP GET or
        // OPTIONS.
        supportedMethods: ["POST"],
        subscriptionClient: createClient({url: wsEndpoint}),
      });

      ReactDOM.createRoot(document.getElementById("graphiql")).render(
        React.createElement(GraphiQL, {
          transport,
          defaultQuery,
          defaultEditorToolsVisibility: true,
        })
      );
    </script>
